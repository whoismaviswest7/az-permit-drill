<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ Permit 连过三轮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, a highway-sign green header strip with three streak pips, one card below. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#16211d; --muted:#5d6b66; --line:#d3dad7;
  --accent:#0b6b4f; --accent-ink:#ffffff;
  --good:#1c7a3e; --good-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe7e5; --warn:#b26a00;
  --display:"Barlow Semi Condensed","Noto Sans","Noto Sans SC","Noto Sans Arabic",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans SC","Noto Sans Arabic",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#19221f; --ink:#e8efec; --muted:#9aa9a3; --line:#2c3935;
    --accent:#2fa37f; --accent-ink:#06120e;
    --good:#6fd08f; --good-bg:#173524; --bad:#ff8a80; --bad-bg:#3b1a18; --warn:#f0b354;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#19221f; --ink:#e8efec; --muted:#9aa9a3; --line:#2c3935;
  --accent:#2fa37f; --accent-ink:#06120e;
  --good:#6fd08f; --good-bg:#173524; --bad:#ff8a80; --bad-bg:#3b1a18; --warn:#f0b354;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.streak{display:flex;align-items:center;gap:8px;font-size:14px}
.pips{display:flex;gap:6px}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent-ink);opacity:.45}
.pip.on{background:var(--accent-ink);opacity:1}
.langsel{font:inherit;font-size:14px;border-radius:6px;border:1.5px solid var(--accent-ink);background:transparent;color:var(--accent-ink);padding:3px 6px}
.langsel option{color:#16211d;background:#fff}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q{font-size:19px;font-weight:500;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;color:inherit;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.langsel:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.opt .k{font-family:var(--display);font-weight:700;color:var(--muted);min-width:1.2em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .tag{margin-inline-start:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.right .tag{color:var(--good)} .opt.wrong .tag{color:var(--bad)}
.exp{border-inline-start:4px solid var(--accent);padding:6px 12px;color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
.row.start{justify-content:flex-start}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.score{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-weight:700;font-size:18px}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums;font-weight:700}
.chip.pass{background:var(--good-bg);color:var(--good)} .chip.fail{background:var(--bad-bg);color:var(--bad)}
.list{display:flex;flex-direction:column;gap:12px}
.miss{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.miss b{font-weight:500}
.miss .y{color:var(--bad);font-size:14px} .miss .a{color:var(--good);font-size:14px} .miss .e{color:var(--muted);font-size:14px}
h2{font-size:16px;margin:0}
.hint{color:var(--muted);font-size:13px;margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="hright">
      <div class="streak"><span id="streakText"></span><div class="pips" aria-hidden="true"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div></div>
      <label><span class="sr" id="langLabel" hidden></span><select id="langSel" class="langsel" aria-label="Language"></select></label>
    </div>
  </header>

  <div class="meta"><span id="roundText"></span><span id="progText"></span><span id="liveText"></span></div>
  <div class="bar"><i id="barFill"></i></div>

  <div class="row start">
    <button class="btn ghost" id="bookBtn" type="button"></button>
    <button class="btn ghost" id="drillBtn" type="button"></button>
    <span class="hint" id="coverage"></span>
  </div>

  <section id="book" class="card" hidden>
    <div class="row" style="justify-content:space-between"><h2 id="bookTitle"></h2><button class="btn ghost" id="bookClose" type="button"></button></div>
    <p class="hint" id="bookNote"></p>
    <div id="bookOpen" class="list"></div>
    <h2 id="bookFixedTitle" hidden></h2>
    <div id="bookFixed" class="list"></div>
  </section>

  <main id="quiz" class="card">
    <p class="q" id="qText"></p>
    <div class="opts" id="opts"></div>
    <div class="exp" id="exp" hidden></div>
    <div class="row"><span class="hint" id="keyHint"></span><button class="btn" id="nextBtn" type="button" hidden></button></div>
  </main>

  <main id="result" class="card" hidden>
    <div class="score" id="scoreNum"></div>
    <div class="verdict" id="verdict"></div>
    <p id="resultMsg" style="margin:0"></p>
    <div id="histWrap"><h2 id="histTitle"></h2><div class="hist" id="hist" style="margin-top:8px"></div></div>
    <div id="missWrap" hidden><h2 id="missTitle"></h2><div id="missList" class="list" style="margin-top:8px"></div></div>
    <div class="row"><button class="btn ghost danger" id="resetBtn" type="button"></button><button class="btn ghost" id="altBtn" type="button"></button><button class="btn" id="againBtn" type="button"></button></div>
  </main>

  <p class="hint" id="footer"></p>
</div>

<script src="lang/zh.js"></script>
<script src="lang/en.js"></script>
<script src="lang/es.js"></script>
<script src="lang/vi.js"></script>
<script src="lang/ar.js"></script>
<script>
const LANG_ORDER = ["zh","en","es","vi","ar"].filter(k => window.AZQ && AZQ[k]);
const LOCK = {63:2, 64:2, 65:2};          // "All of the above" stays last
const ROUND = 30, PASS = 24, GOAL = 3, DRILL_MAX = 30, MISSED_PER_ROUND = 12;
const KEY = "azPermitDrill.v1", LKEY = "azPermitDrill.lang";
const N = AZQ.zh.items.length;
const $ = id => document.getElementById(id);

// ---------- storage ----------
let state = {streak:0, history:[], missed:[], wrongCount:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.history)) state = s; } catch(e){}
if (!Array.isArray(state.missed)) state.missed = [];
if (!state.wrongCount || typeof state.wrongCount !== "object") state.wrongCount = {};
state.missed = state.missed.filter(i => i >= 0 && i < N);
state.missed.forEach(i => { if (!state.wrongCount[i]) state.wrongCount[i] = 1; });
if (!state.seen || typeof state.seen !== "object") {
  // Older saves didn't track this. Anyone with past rounds has already seen the original 72 questions,
  // so count those as seen once and let the newer questions come up first.
  state.seen = {};
  if (state.history.length) for (let i = 0; i < 72; i++) state.seen[i] = 1;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };

let lang;
try { lang = localStorage.getItem(LKEY); } catch(e){}
if (!AZQ[lang]) {
  const nav = (navigator.language || "").slice(0,2).toLowerCase();
  lang = state.history.length ? "zh" : (AZQ[nav] ? nav : "en");
}

const L = () => AZQ[lang];
const t = (k, v) => (L().ui[k] ?? AZQ.en.ui[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v && v[x] !== undefined ? v[x] : "");
const item = i => L().items[i] || AZQ.zh.items[i];

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---------- round state ----------
let mode = "main";            // "main" | "drill"
let round = [], pos = 0, view = "quiz", lastResult = null, resetArmed = false;

function makeItem(i){
  if (LOCK[i] !== undefined) return {i, perm:[0,1,2], ans:LOCK[i], picked:undefined};
  const perm = shuffle([0,1,2]);
  return {i, perm, ans:perm.indexOf(0), picked:undefined};
}
// Questions available in the current language (newer questions may exist only in some languages).
const pool = () => [...Array(Math.min(L().items.length, N)).keys()];
const seenCount = i => state.seen[i] || 0;
function buildMain(){
  const p = pool();
  const missed = shuffle(state.missed.filter(i => i < p.length)).slice(0, MISSED_PER_ROUND);
  // Fill the rest with the least-seen questions first, so every question comes up before any repeats.
  const rest = shuffle(p.filter(i => !missed.includes(i)))
    .sort((a, b) => seenCount(a) - seenCount(b))
    .slice(0, ROUND - missed.length);
  round = shuffle(missed.concat(rest)).map(makeItem); pos = 0;
}
function buildDrill(){
  round = shuffle(state.missed).slice(0, DRILL_MAX).map(makeItem); pos = 0;
}
const rightCount = () => round.filter(r => r.picked === r.ans).length;

// ---------- rendering ----------
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function paintChrome(){
  const lg = L();
  document.documentElement.lang = lg.htmlLang; document.documentElement.dir = lg.dir;
  document.title = t("title");
  $("title").textContent = t("title");
  $("langSel").setAttribute("aria-label", t("lang"));
  $("streakText").textContent = t("streak", {n:Math.min(state.streak,GOAL), g:GOAL});
  document.querySelectorAll(".pip").forEach((p,k)=>p.classList.toggle("on", k < state.streak));
  $("bookBtn").textContent = t("bookBtn");
  $("drillBtn").textContent = t("drillBtn", {n:state.missed.length});
  $("drillBtn").disabled = state.missed.length === 0;
  $("keyHint").textContent = t("keyHint");
  const p = pool();
  $("footer").textContent = t("footer", {n: p.length});
  $("coverage").textContent = t("coverage", {s: p.filter(i => seenCount(i) > 0).length, n: p.length});
  $("bookClose").textContent = t("back");
  const total = round.length || 1;
  $("roundText").textContent = mode === "drill" ? t("drillRound") : t("round", {n: state.history.length + (view === "result" && mode === "main" ? 0 : 1)});
  $("progText").textContent = view === "result" ? t("endRound") : t("prog", {i: Math.min(pos+1, total), t: total});
  $("liveText").textContent = t("live", {n: rightCount()});
  $("barFill").style.width = (view === "result" ? 100 : (pos/total*100)) + "%";
}

function paintQuestion(){
  const it = round[pos]; if (!it) return;
  const [q, o, e] = item(it.i);
  $("qText").textContent = q;
  const box = $("opts"); box.textContent = "";
  it.perm.forEach((k, n) => {
    const b = el("button", "opt"); b.type = "button";
    b.append(el("span","k", n+1), el("span", null, o[k]));
    if (it.picked !== undefined){
      b.disabled = true;
      if (n === it.ans){ b.classList.add("right"); b.append(el("span","tag",t("rightTag"))); }
      else if (n === it.picked){ b.classList.add("wrong"); b.append(el("span","tag",t("pickTag"))); }
    }
    b.addEventListener("click", () => choose(n));
    box.append(b);
  });
  const answered = it.picked !== undefined;
  $("exp").hidden = !answered;
  if (answered) $("exp").textContent = (it.picked === it.ans ? t("gotRight") : t("gotWrong")) + e;
  const nb = $("nextBtn"); nb.hidden = !answered;
  nb.textContent = pos === round.length - 1 ? t("seeScore") : t("next");
}

function missRow(i, pickedText){
  const [q, o, e] = item(i);
  const d = el("div","miss");
  d.append(el("b", null, q));
  if (pickedText !== undefined) d.append(el("span","y", t("yourPick") + pickedText));
  else d.append(el("span","y", t("wrongTimes", {n: state.wrongCount[i] || 1})));
  d.append(el("span","a", t("correctAns") + o[0]), el("span","e", e));
  return d;
}

function paintResult(){
  if (!lastResult) return;
  const r = lastResult, total = r.items.length;
  const right = r.items.filter(x => x.picked === x.ans).length;
  $("scoreNum").textContent = right + " / " + total + "　" + Math.round(right/total*100) + "%";
  const v = $("verdict");
  if (r.mode === "main"){
    const pass = right >= PASS, done = state.streak >= GOAL;
    v.className = "verdict " + (pass ? "pass" : "fail");
    v.textContent = done ? t("done") : pass ? t("pass") : t("fail");
    $("resultMsg").textContent = done ? t("msgDone") : pass ? t("msgPass", {n: GOAL - state.streak}) : t("msgFail");
    $("againBtn").textContent = done ? t("againDone") : t("again");
    $("altBtn").hidden = state.missed.length === 0;
    $("altBtn").textContent = t("drillBtn", {n: state.missed.length});
  } else {
    v.className = "verdict " + (state.missed.length ? "fail" : "pass");
    v.textContent = t("drillDoneT");
    $("resultMsg").textContent = state.missed.length ? t("drillMsgLeft", {n: state.missed.length}) : t("drillMsgClear");
    $("againBtn").textContent = t("backMain");
    $("altBtn").hidden = state.missed.length === 0;
    $("altBtn").textContent = t("drillAgain");
  }
  $("histTitle").textContent = t("histTitle");
  const h = $("hist"); h.textContent = "";
  state.history.forEach((s,n) => h.append(el("span", "chip " + (s >= PASS ? "pass" : "fail"), t("histChip", {n:n+1, s, t:ROUND}))));
  $("histWrap").hidden = state.history.length === 0;
  $("missTitle").textContent = t("missTitle");
  const ml = $("missList"); ml.textContent = "";
  const wrongs = r.items.filter(x => x.picked !== x.ans);
  wrongs.forEach(x => ml.append(missRow(x.i, item(x.i)[1][x.perm[x.picked]])));
  $("missWrap").hidden = wrongs.length === 0;
  $("resetBtn").textContent = resetArmed ? t("resetConfirm") : t("reset");
}

function paintBook(){
  const byCount = (a,b) => (state.wrongCount[b]||0) - (state.wrongCount[a]||0);
  const open = state.missed.slice().sort(byCount);
  const fixed = Object.keys(state.wrongCount).map(Number).filter(i => i < N && !state.missed.includes(i)).sort(byCount);
  $("bookTitle").textContent = t("bookTitle", {n: open.length});
  $("bookNote").textContent = open.length ? t("bookNote") : t("bookEmpty");
  const bo = $("bookOpen"); bo.textContent = ""; open.forEach(i => bo.append(missRow(i)));
  const bf = $("bookFixed"); bf.textContent = ""; fixed.forEach(i => bf.append(missRow(i)));
  $("bookFixedTitle").textContent = t("bookFixed");
  $("bookFixedTitle").hidden = fixed.length === 0;
}

function show(v){
  view = v;
  $("quiz").hidden = v !== "quiz"; $("result").hidden = v !== "result"; $("book").hidden = v !== "book";
  paintAll();
}
let beforeBook = "quiz";
function paintAll(){
  paintChrome();
  if (view === "quiz") paintQuestion();
  if (view === "result") paintResult();
  if (view === "book") paintBook();
}

// ---------- actions ----------
function choose(n){
  const it = round[pos];
  if (!it || it.picked !== undefined) return;
  it.picked = n;
  state.seen[it.i] = seenCount(it.i) + 1;
  if (n === it.ans) state.missed = state.missed.filter(x => x !== it.i);
  else { if (!state.missed.includes(it.i)) state.missed.push(it.i); state.wrongCount[it.i] = (state.wrongCount[it.i]||0) + 1; }
  save(); paintAll();
  $("nextBtn").focus();
}
function next(){
  const it = round[pos];
  if (!it || it.picked === undefined) return;
  if (pos < round.length - 1){ pos++; paintAll(); return; }
  finish();
}
function finish(){
  const right = rightCount();
  if (mode === "main"){
    state.history.push(right);
    state.streak = right >= PASS ? state.streak + 1 : 0;
    save();
  }
  lastResult = {mode, items: round.map(x => ({...x}))};
  resetArmed = false;
  show("result"); window.scrollTo(0,0); $("againBtn").focus();
}
function startMain(){ mode = "main"; buildMain(); resetArmed = false; show("quiz"); }
function startDrill(){ if (!state.missed.length) return; mode = "drill"; buildDrill(); resetArmed = false; show("quiz"); }

$("nextBtn").addEventListener("click", next);
$("againBtn").addEventListener("click", startMain);
$("altBtn").addEventListener("click", startDrill);
$("drillBtn").addEventListener("click", startDrill);
$("bookBtn").addEventListener("click", () => { if (view !== "book") beforeBook = view; show("book"); window.scrollTo(0,0); });
$("bookClose").addEventListener("click", () => show(beforeBook));
$("resetBtn").addEventListener("click", () => {
  if (!resetArmed){ resetArmed = true; paintResult(); return; }
  state = {streak:0, history:[], missed:[], wrongCount:{}, seen:{}}; save(); startMain();
});

const sel = $("langSel");
LANG_ORDER.forEach(k => { const o = el("option", null, AZQ[k].name); o.value = k; sel.append(o); });
sel.value = lang;
sel.addEventListener("change", () => { lang = sel.value; try { localStorage.setItem(LKEY, lang); } catch(e){} paintAll(); });

document.addEventListener("keydown", ev => {
  if (view !== "quiz" || ev.target.tagName === "SELECT") return;
  const it = round[pos]; if (!it) return;
  if (it.picked === undefined && ["1","2","3"].includes(ev.key)) { ev.preventDefault(); choose(+ev.key - 1); }
  else if (it.picked !== undefined && ev.key === "Enter") { ev.preventDefault(); next(); }
});

startMain();
</script>
</body>
</html>
